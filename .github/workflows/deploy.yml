name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Form App
        run: |
          flutter build web -t lib/main_form.dart --base-href "/register-form/"
          mv build/web build/web_form

      - name: Build Admin App
        run: |
          flutter build web -t lib/main.dart --base-href "/register-form/admin/"
          mv build/web build/web_admin

      - name: Prepare Final Folder
        run: |
          mkdir -p build/final_publish
          cp -r build/web_form/* build/final_publish/
          mkdir -p build/final_publish/admin
          cp -r build/web_admin/* build/final_publish/admin/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/final_publish
